server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/authdb
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      spring:
      ddl-auto: validate

    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
