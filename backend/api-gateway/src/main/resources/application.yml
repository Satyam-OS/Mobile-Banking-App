server:
  port: ${PORT:8080}

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      routes:

        - id: auth-api-docs
          uri: ${AUTH_SERVICE_URL}
          predicates:
            - Path=/auth/v3/api-docs/**
          filters:
            - RewritePath=/auth/v3/api-docs(?<segment>.*), /v3/api-docs${segment}

        - id: account-api-docs
          uri: ${ACCOUNT_SERVICE_URL}
          predicates:
            - Path=/account/v3/api-docs/**
          filters:
            - RewritePath=/account/v3/api-docs(?<segment>.*), /v3/api-docs${segment}

        - id: transaction-api-docs
          uri: ${TRANSACTION_SERVICE_URL}
          predicates:
            - Path=/transaction/v3/api-docs/**
          filters:
            - RewritePath=/transaction/v3/api-docs(?<segment>.*), /v3/api-docs${segment}


        - id: block-account-internal
          uri: no://op
          predicates:
            - Path=/account/internal/**
          filters:
            - SetStatus=403


        - id: auth-user-protected
          uri: ${AUTH_SERVICE_URL}
          predicates:
            - Path=/auth/user/**
          filters:
            - StripPrefix=1
            - JwtAuthenticationFilter


        - id: auth-service
          uri: ${AUTH_SERVICE_URL}
          predicates:
            - Path=/auth/**
          filters:
            - StripPrefix=1


        - id: otp-service
          uri: ${AUTH_SERVICE_URL}
          predicates:
            - Path=/otp/**


        - id: kyc-service
          uri: ${AUTH_SERVICE_URL}
          predicates:
            - Path=/kyc/**
          filters:
            - JwtAuthenticationFilter


        - id: account-service
          uri: ${ACCOUNT_SERVICE_URL}
          predicates:
            - Path=/account/**
          filters:
            - StripPrefix=1
            - JwtAuthenticationFilter


        - id: transaction-service
          uri: ${TRANSACTION_SERVICE_URL}
          predicates:
            - Path=/transaction/**
          filters:
            - StripPrefix=1
            - JwtAuthenticationFilter


springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: Auth Service
        url: /auth/v3/api-docs
      - name: Account Service
        url: /account/v3/api-docs
      - name: Transaction Service
        url: /transaction/v3/api-docs
    disable-swagger-default-url: true
    config-url: /v3/api-docs/swagger-config
  api-docs:
    enabled: true

jwt:
  secret: ${JWT_SECRET}

management:
  endpoints:
    web:
      exposure:
        include: health,info