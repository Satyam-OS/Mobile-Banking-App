server:
  port: ${PORT:8080}

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      routes:
        # ─── Swagger / API Docs (no JWT) ─────────────────────────────────────
        - id: auth-api-docs
          uri: ${AUTH_SERVICE_URL}
          predicates:
            - Path=/auth/v3/api-docs/**
          filters:
            - RewritePath=/auth/v3/api-docs(?<segment>.*), /v3/api-docs${segment}

        - id: account-api-docs
          uri: ${ACCOUNT_SERVICE_URL}
          predicates:
            - Path=/account/v3/api-docs/**
          filters:
            - RewritePath=/account/v3/api-docs(?<segment>.*), /v3/api-docs${segment}

        - id: transaction-api-docs
          uri: ${TRANSACTION_SERVICE_URL}
          predicates:
            - Path=/transaction/v3/api-docs/**
          filters:
            - RewritePath=/transaction/v3/api-docs(?<segment>.*), /v3/api-docs${segment}

        # ─── Block direct internal account creation ───────────────────────────
        - id: block-account-internal
          uri: no://op
          predicates:
            - Path=/account/internal/**
          filters:
            - SetStatus=403

        # ─── Auth user dashboard (JWT REQUIRED) ──────────────────────────────
        # Must be BEFORE the general /auth/** route — first match wins
        - id: auth-user-protected
          uri: ${AUTH_SERVICE_URL}
          predicates:
            - Path=/auth/user/**
          filters:
            - StripPrefix=1
            - JwtAuthenticationFilter

        # ─── Auth: login, reset-password (public, no JWT) ────────────────────
        - id: auth-service
          uri: ${AUTH_SERVICE_URL}
          predicates:
            - Path=/auth/**
          filters:
            - StripPrefix=1

        # ─── OTP routes (public, no JWT) ─────────────────────────────────────
        # OtpController is @RequestMapping("/otp") on auth-service — no StripPrefix
        - id: otp-service
          uri: ${AUTH_SERVICE_URL}
          predicates:
            - Path=/otp/**

        # ─── KYC routes (JWT REQUIRED) ───────────────────────────────────────
        # KycController is @RequestMapping("/kyc") on auth-service — no StripPrefix
        - id: kyc-service
          uri: ${AUTH_SERVICE_URL}
          predicates:
            - Path=/kyc/**
          filters:
            - JwtAuthenticationFilter

        # ─── Account Service (JWT REQUIRED) ──────────────────────────────────
        - id: account-service
          uri: ${ACCOUNT_SERVICE_URL}
          predicates:
            - Path=/account/**
          filters:
            - StripPrefix=1
            - JwtAuthenticationFilter

        # ─── Transaction Service (JWT REQUIRED) ──────────────────────────────
        - id: transaction-service
          uri: ${TRANSACTION_SERVICE_URL}
          predicates:
            - Path=/transaction/**
          filters:
            - StripPrefix=1
            - JwtAuthenticationFilter

# ─── Swagger UI aggregation ───────────────────────────────────────────────────
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: Auth Service
        url: /auth/v3/api-docs
      - name: Account Service
        url: /account/v3/api-docs
      - name: Transaction Service
        url: /transaction/v3/api-docs
    disable-swagger-default-url: true
    config-url: /v3/api-docs/swagger-config
  api-docs:
    enabled: true

jwt:
  secret: ${JWT_SECRET}

management:
  endpoints:
    web:
      exposure:
        include: health,info