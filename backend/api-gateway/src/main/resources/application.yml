server:
  port: ${PORT:8080}

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      routes:
        # ─── Swagger / API Docs (no JWT needed) ──────────────────────────────
        - id: auth-api-docs
          uri: ${AUTH_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/auth/v3/api-docs/**
          filters:
            - RewritePath=/auth/v3/api-docs(?<segment>.*), /v3/api-docs${segment}

        - id: account-api-docs
          uri: ${ACCOUNT_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/account/v3/api-docs/**
          filters:
            - RewritePath=/account/v3/api-docs(?<segment>.*), /v3/api-docs${segment}

        - id: transaction-api-docs
          uri: ${TRANSACTION_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/transaction/v3/api-docs/**
          filters:
            - RewritePath=/transaction/v3/api-docs(?<segment>.*), /v3/api-docs${segment}

        # ─── Security: block direct internal account creation ─────────────────
        - id: block-account-internal
          uri: no://op
          predicates:
            - Path=/account/internal/**
          filters:
            - SetStatus=403

        # ─── Auth user dashboard (JWT REQUIRED) ──────────────────────────────
        # MUST be before the general /auth/** route (first-match wins)
        - id: auth-user-protected
          uri: ${AUTH_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/auth/user/**
          filters:
            - StripPrefix=1
            - JwtAuthenticationFilter

        # ─── Auth Service: login + reset-password (public, no JWT) ───────────
        - id: auth-service
          uri: ${AUTH_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/auth/**
          filters:
            - StripPrefix=1

        # ─── OTP routes (public, no JWT) ─────────────────────────────────────
        # OtpController maps to /otp/** directly on auth-service (NOT /auth/otp/**)
        # No StripPrefix — path is forwarded as-is: /otp/generate → auth-service:/otp/generate
        - id: otp-service
          uri: ${AUTH_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/otp/**

        # ─── KYC routes (JWT REQUIRED — KYC token from OTP verify) ──────────
        # KycController maps to /kyc/** directly on auth-service (NOT /auth/kyc/**)
        - id: kyc-service
          uri: ${AUTH_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/kyc/**
          filters:
            - JwtAuthenticationFilter

        # ─── Account Service (JWT REQUIRED) ──────────────────────────────────
        - id: account-service
          uri: ${ACCOUNT_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/account/**
          filters:
            - StripPrefix=1
            - JwtAuthenticationFilter

        # ─── Transaction Service (JWT REQUIRED) ──────────────────────────────
        - id: transaction-service
          uri: ${TRANSACTION_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/transaction/**
          filters:
            - StripPrefix=1
            - JwtAuthenticationFilter

# ─── Swagger UI aggregation ───────────────────────────────────────────────────
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: Auth Service
        url: /auth/v3/api-docs
      - name: Account Service
        url: /account/v3/api-docs
      - name: Transaction Service
        url: /transaction/v3/api-docs
    disable-swagger-default-url: true
    config-url: /v3/api-docs/swagger-config
  api-docs:
    enabled: true

jwt:
  secret: ${JWT_SECRET:BANKING_APP_SECRET_KEY_1234567890}

management:
  endpoints:
    web:
      exposure:
        include: health,info
